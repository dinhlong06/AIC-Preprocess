# Điều chỉnh cho máy dùng chung + Docker rootless. Compose tự nạp file này đè lên
# docker-compose.yaml, không cần cờ -f. Tag !override là bắt buộc: mặc định compose
# NỐI THÊM vào list `ports`/`volumes` của file gốc chứ không thay thế.
#
# 1. Port: 9200, 19530, 9000, 8000 đã bị service của user khác chiếm (9200 đang là
#    một Elasticsearch 7.17 không phải của mình). Chỉ đổi phía host, port trong
#    network compose giữ nguyên nên code không phải sửa gì. Service `api` định
#    lấy 8020 nhưng port đó cũng đã bị user khác chiếm (UID khác, xác nhận qua
#    /proc/net/tcp) -> đổi sang 8021.
# 2. Volume: bind mount ./volumes/* không dùng được với rootless — ES (uid 1000) và
#    Mongo (uid 999) map ra subuid không có quyền ghi vào thư mục của vannk, chết với
#    "failed to obtain node locks" / "chown: Operation not permitted". Named volume
#    để Docker tự quản quyền.
services:
  etcd:
    volumes: !override
      - etcd_data:/etcd
  minio:
    ports: !override
      - "9002:9000"
      - "9003:9001"
    volumes: !override
      - minio_data:/minio_data
  standalone:
    ports: !override
      - "19531:19530"
      - "19092:9091"
    volumes: !override
      - milvus_data:/var/lib/milvus
  attu:
    ports: !override
      - "8010:3000"
  mongodb:
    ports: !override
      - "27018:27017"
    volumes: !override
      - mongo_data:/data/db
  elasticsearch:
    # / của host đầy 98% (còn 32GB) < max_headroom mặc định 150GB của ES 9 -> ES
    # không cấp phát nổi shard nào, cluster đứng RED và mọi lệnh tạo index treo.
    environment:
      cluster.routing.allocation.disk.threshold_enabled: "false"
      # 512MB -> trần max_clause_count thấp, câu OCR dài + fuzzy bị 400 "too many clauses".
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      # File gốc chỉ mở CORS cho http://localhost:8081, mà elasticvue đã dời sang
      # 8084 -> trình duyệt bị chặn. Elasticvue gọi ES TỪ TRÌNH DUYỆT nên origin
      # đổi theo cách bạn mở UI (localhost qua ssh-forward, hay IP server) -> mở hết.
      # Phải là regex "/.*/" chứ không phải "*": ES ghi env ra overrides.yml, dấu *
      # trần bị YAML hiểu là alias -> ES chết khi khởi động.
      http.cors.allow-origin: "/.*/"
      http.cors.allow-headers: X-Requested-With,Content-Type,Content-Length,Authorization
    ports: !override
      - "19201:9200"
    volumes: !override
      - es_data:/usr/share/elasticsearch/data
  elasticvue:
    ports: !override
      - "8084:8080"
  api:
    ports: !override
      - "8021:8000"

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mongo_data:
  es_data:
