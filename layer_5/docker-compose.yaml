services:
  etcd:
    container_name: milvus-etcd
    restart: unless-stopped
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    restart: unless-stopped
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    restart: unless-stopped
    image: milvusdb/milvus:v2.6.11
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
  attu:
    container_name: milvus-attu
    image: zilliz/attu:latest
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "8000:3000"
    depends_on:
      - "standalone"

  mongodb:
    container_name: app-mongodb
    restart: unless-stopped
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mongodb:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 20s
      retries: 3

  elasticsearch:
    container_name: app-elasticsearch
    restart: unless-stopped
    # Build từ repo plugin tiếng Việt: nó tự compile native lib coccoc-tokenizer
    # rồi build & cài plugin analysis-vietnamese khớp ES_VERSION.
    build:
      context: https://github.com/duydo/elasticsearch-analysis-vietnamese.git#master
      args:
        ES_VERSION: "9.3.0"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      http.cors.enabled: "true"
      http.cors.allow-origin: "http://localhost:8081"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  elasticvue:
    container_name: app-elasticvue
    image: cars10/elasticvue:latest
    ports:
      - "8081:8080"
    depends_on:
      - "elasticsearch"

  app:
    container_name: ai-challenge-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MILVUS_URI: http://standalone:19530
      MONGO_URI: mongodb://root:rootpass@mongodb:27017
      ELASTICSEARCH_URI: http://elasticsearch:9200
    depends_on:
      - "standalone"
      - "mongodb"
      - "elasticsearch"

  api:
    container_name: ai-challenge-api
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MILVUS_URI: http://standalone:19530
      MONGO_URI: mongodb://root:rootpass@mongodb:27017
      ELASTICSEARCH_URI: http://elasticsearch:9200
      API_KEY: ${API_KEY:-123}
    depends_on:
      - "standalone"
      - "mongodb"
      - "elasticsearch"

networks:
  default:
    name: milvus