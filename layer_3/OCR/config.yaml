# OCR Pipeline Configuration -- 2 stages, run separately (see README.md)
#   Stage 1 (run_paddle.py):  GPU detection+recognition -> raw ASCII text
#   Stage 2 (run_correct.py): ising-calibration VLM restores diacritics
# -----------------------------------------------------------------------------

paddle:
  # run_paddle.sh always passes --input pointing at
  # ../../layer_2/Keyframe_Extracting/benchmark/<PIPELINE> -- this is only the
  # fallback for calling run_paddle.py directly without the wrapper script.
  input_dir: "../../layer_2/Keyframe_Extracting/benchmark/pipeline_c"
  # VietOCR result (every non-empty box, no confidence filter, see
  # ocr/paddle_engine.py) -- this is what stage 2 corrects.
  output_file: "./output/output_vietocr.json"
  # Paddle's own recognizer output, untouched by the fallback above -- kept
  # only for comparing the two recognizers, not consumed by stage 2.
  output_file_paddle_origin: "./output/output_paddle_origin.json"

  # 0 = no limit (process every frame found in input_dir)
  limit: 0

  # Save output_file every N frames and resume from it on restart. 0 disables.
  checkpoint_every: 5000

  # CLAHE + auto news-band crop before OCR. Measured HARMFUL on this dataset
  # (48/60 test frames corrupted, several lost the channel logo/timestamp
  # entirely) -- the crop heuristic was tuned for a different show's layout.
  # Leave false unless re-tuned (roi_top_pct/roi_bottom_pct/news_band_ratio
  # in frame_skip.py) and re-validated for the source in use.
  preprocess: false

  # Frame-skip: only blur remains (blank + near-duplicate similarity skip
  # removed 2026-08-27 -- see ocr/frame_skip.py docstring for why. Set to 0
  # to disable.
  skip:
    blur_threshold: 50.0             # Laplacian variance below this = skip as blurry

  ocr:
    lang: "vi"
    # PP-OCRv6 ignores `lang` entirely (en/vi byte-identical) and its marks
    # are often wrong (see paddleocr-vietnamese-charset-gap memory) -- kept
    # as-is, no ascii-stripping workaround; stage 2 restores correct marks
    # from the image regardless.
    ocr_version: null   # omit for paddleocr's current default (PP-OCRv6 as of 3.7.0)
    # Measured to NOT fix word-merging ("TINCHINH"-type errors) -- kept only
    # as an escape hatch, do not set without re-testing (see memory).
    unclip_ratio: null

correct:
  # Same frames folder passed to run_paddle.sh / --input for stage 1.
  frames_dir: "../../layer_2/Keyframe_Extracting/benchmark/pipeline_c"
  paddle_output: "./output/output_vietocr.json"
  output_file: "./output/output_hybrid.json"
  # NVIDIA_API_KEY env var is required (or pass --api-key)
  checkpoint_every: 20
  # Concurrent requests to the ising-calibration API. An isolated 60-frame
  # benchmark measured 6 as the sweet spot, but a real 714-frame run stalled
  # visibly at 6 (key already warmed up from a day of testing) -- 4 is the
  # current default based on that live observation. Re-measure before raising.
  workers: 4

# Third stage (run_vlm_correct.py, separate GPU container, Dockerfile.vlm) --
# targeted correction for boxes still merged into a space-less blob after
# merge_recognizers.py (~0.55% of boxes on batch1, see ocr/vlm_correct.py
# docstring for the full measurement/decision history). Runs on the merged
# output of merge_recognizers.py, not on paddle's raw output directly.
vlm_correct:
  frames_dir: "../../layer_2/Keyframe_Extracting/benchmark/pipeline_c"
  merged_input: "./output/output_vietocr_merged.json"
  output_file: "./output/output_vlm_corrected.json"
  model_dir: "../OCR_v2/models/qwen3-vl-4b-vi-ocr"
  # boxes per generate() call -- 60 measured batched cleanly on an 11GB
  # shared-cluster GPU (~0.4-0.5s/box); raise only after re-checking VRAM
  # headroom (full-frame batching OOM'd at this size, see chat history).
  # Lowered to 16 on 2026-08-28: batch1 real run OOM'd 9x in a row at 60 --
  # error logs showed near-zero free VRAM margin even before contention, so
  # a smaller batch buys more headroom against other jobs' transient spikes.
  batch_size: 16
  # Save output_file + progress sidecar every N boxes corrected. 0 disables.
  checkpoint_every: 500
